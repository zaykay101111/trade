[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-method"
version = "0.1.0"
description = "Reproducible NBA probability and paper-policy research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "xgboost>=2.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
nba = ["nba_api>=1.5,<2"]
pdf = ["pdfplumber>=0.11,<1"]

[project.scripts]
sports = "sports_method.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
